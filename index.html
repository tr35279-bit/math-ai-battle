<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math AI Battle: Exponential & Logarithm</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#10152d,#172b4d);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:22px}.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:24px;box-shadow:0 12px 35px #0005}
h1{margin:0 0 8px;font-size:32px}h2{margin:6px 0 16px}.sub{opacity:.8}.top{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{flex:1;min-width:140px;background:#0003;border-radius:14px;padding:13px}.stat b{display:block;font-size:25px;margin-top:3px}
.q{font-size:25px;line-height:1.5;background:#0003;padding:20px;border-radius:16px;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt,button{border:0;border-radius:13px;padding:14px;font-size:18px;cursor:pointer}.opt{background:#f4f7ff;color:#111}.opt:hover{transform:translateY(-2px);background:#fff}.opt:disabled{cursor:default;opacity:.85}
.good{background:#1e9e62!important;color:#fff!important}.bad{background:#c84b57!important;color:#fff!important}.bar{height:12px;background:#0005;border-radius:99px;overflow:hidden}.fill{height:100%;background:#62d6ff;width:0%;transition:.25s}
#msg{min-height:34px;margin:15px 0;font-size:18px}.controls{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#62d6ff;color:#06121c;font-weight:700}.secondary{background:#ffffff22;color:#fff}.hidden{display:none}
.airow{display:flex;align-items:center;gap:10px}.face{font-size:35px}.small{font-size:14px;opacity:.75}
@media(max-width:600px){.options{grid-template-columns:1fr}.q{font-size:21px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🤖 Math AI Battle</h1><div class="sub">เกมต่อสู้กับ AI: ฟังก์ชันเอกซ์โพเนนเชียลและฟังก์ชันลอการิทึม</div>
<div id="start">
<h2>🎮 กติกา</h2>
<p>ตอบโจทย์ให้ถูกและเร็วกว่า AI • 10 ข้อ • AI จะปรับความเร็วตามผลงานของคุณ</p>
<button class="primary" onclick="startGame()">เริ่มเกม</button>
</div>
<div id="game" class="hidden">
<div class="top">
<div class="stat">คะแนนคุณ<b id="score">0</b></div>
<div class="stat">คะแนน AI<b id="aiscore">0</b></div>
<div class="stat">ข้อที่<b id="num">1/10</b></div>
</div>
<div class="airow"><div class="face">🤖</div><div style="flex:1"><b>AI กำลังคิด...</b><div class="bar"><div class="fill" id="aibar"></div></div><div class="small" id="aitext"></div></div></div>
<div class="q" id="question"></div>
<div class="options" id="options"></div>
<div id="msg"></div>
<button class="secondary" onclick="nextQuestion()" id="next" disabled>ข้อถัดไป →</button>
</div>
<div id="end" class="hidden">
<h2>🏁 จบเกม</h2><div id="result"></div>
<button class="primary" onclick="startGame()">เล่นอีกครั้ง</button>
</div>
</div></div>
<script>
const qs=[
{q:"ถ้า 2^x = 16 แล้ว x เท่ากับเท่าไร?",a:["2","3","4","8"],c:2,e:"exp"},
{q:"ค่า log₂(32) เท่ากับเท่าไร?",a:["4","5","6","16"],c:1,e:"log"},
{q:"ถ้า 3^x = 81 แล้ว x เท่ากับเท่าไร?",a:["2","3","4","5"],c:2,e:"exp"},
{q:"ค่า log₁₀(1000) เท่ากับเท่าไร?",a:["2","3","10","100"],c:1,e:"log"},
{q:"ข้อใดเท่ากับ 2⁻³?",a:["-8","-6","1/8","1/6"],c:2,e:"exp"},
{q:"ถ้า log₃(x)=2 แล้ว x เท่ากับเท่าไร?",a:["5","6","9","12"],c:2,e:"log"},
{q:"ค่า 4^0 เท่ากับเท่าไร?",a:["0","1","4","ไม่กำหนด"],c:1,e:"exp"},
{q:"ถ้า log₂(x)=5 แล้ว x เท่ากับเท่าไร?",a:["10","16","25","32"],c:3,e:"log"},
{q:"กราฟ y=2^x เป็นฟังก์ชันประเภทใด?",a:["เอกซ์โพเนนเชียล","ลอการิทึม","กำลังสอง","เส้นตรง"],c:0,e:"exp"},
{q:"ฟังก์ชันใดเป็นอินเวอร์สของ y=2^x?",a:["y=x²","y=log₂(x)","y=2x","y=ln(x²)"],c:1,e:"log"},
{q:"ค่า log₅(1) เท่ากับเท่าไร?",a:["0","1","5","-1"],c:0,e:"log"},
{q:"ถ้า 10^x=0.01 แล้ว x เท่ากับเท่าไร?",a:["-2","-1","2","10"],c:0,e:"exp"}
];
let pool=[],i=0,score=0,ai=0,locked=false,timer;
function startGame(){pool=[...qs].sort(()=>Math.random()-.5).slice(0,10);i=0;score=0;ai=0;document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('game').classList.remove('hidden');showQ()}
function showQ(){locked=false;let x=pool[i];document.getElementById('score').textContent=score;document.getElementById('aiscore').textContent=ai;document.getElementById('num').textContent=`${i+1}/10`;document.getElementById('question').textContent=x.q;document.getElementById('msg').textContent="";let op=document.getElementById('options');op.innerHTML="";x.a.forEach((v,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(n,b);op.appendChild(b)});document.getElementById('next').disabled=true;runAI()}
function runAI(){clearInterval(timer);let fill=document.getElementById('aibar'), text=document.getElementById('aitext');let skill=Math.min(.9,.42+(score/100));let t=1200-Math.random()*500-(skill*250);let start=Date.now();text.textContent="AI วิเคราะห์โจทย์...";timer=setInterval(()=>{let p=Math.min(100,(Date.now()-start)/t*100);fill.style.width=p+"%";if(p>=100){clearInterval(timer);let chance=Math.random()<skill; if(chance)ai++;text.textContent=chance?"AI ตอบเสร็จแล้ว!":"AI ติดกับดักโจทย์นี้ 😵";document.getElementById('aiscore').textContent=ai}},30)}
function answer(n,b){if(locked)return;locked=true;clearInterval(timer);let x=pool[i];document.querySelectorAll('.opt').forEach(z=>z.disabled=true);if(n===x.c){b.classList.add('good');score+=10;document.getElementById('msg').innerHTML="✅ ถูกต้อง! +10 คะแนน"}else{b.classList.add('bad');document.querySelectorAll('.opt')[x.c].classList.add('good');document.getElementById('msg').innerHTML=`❌ ยังไม่ถูก — คำตอบคือ <b>${x.a[x.c]}</b>`}document.getElementById('score').textContent=score;document.getElementById('next').disabled=false}
function nextQuestion(){if(!locked)return;i++;if(i>=10)finish();else showQ()}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('end').classList.remove('hidden');let text=score>ai?"คุณทำคะแนนได้มากกว่า AI!":score===ai?"คะแนนเท่ากับ AI!":"AI ทำคะแนนได้มากกว่าในรอบนี้";document.getElementById('result').innerHTML=`<h2>${text}</h2><p>คุณ: <b>${score}</b> คะแนน &nbsp;|&nbsp; AI: <b>${ai}</b> คะแนน</p><p>เนื้อหาที่ฝึก: เลขยกกำลัง, ฟังก์ชันเอกซ์โพเนนเชียล, ลอการิทึม และความสัมพันธ์อินเวอร์ส</p>`}
</script>
</body>
</html>
